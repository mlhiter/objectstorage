name: Build Sealos from Sealos

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      version:
        description: 'Build version, supports sha-* or v*; empty uses current commit sha.'
        required: false
        type: string

permissions:
  contents: read

env:
  GHCR_FRONTEND_RUNTIME_IMAGE: ghcr.io/${{ github.repository }}/objectstorage-frontend
  GHCR_CONTROLLER_RUNTIME_IMAGE: ghcr.io/${{ github.repository }}/objectstorage-controller
  GHCR_SEALOS_IMAGE: ghcr.io/${{ github.repository }}/objectstorage-cluster

concurrency:
  group: build-sealos-from-sealos-${{ github.ref }}
  cancel-in-progress: true

jobs:
  meta:
    name: Release Metadata
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      image_tag: ${{ steps.meta.outputs.image_tag }}
      is_release: ${{ steps.meta.outputs.is_release }}
      oss_prefix: ${{ steps.meta.outputs.oss_prefix }}
      oss_tag: ${{ steps.meta.outputs.oss_tag }}
    steps:
      - name: Compute tags
        id: meta
        run: |
          set -euo pipefail

          RAW_VERSION="${{ github.event.inputs.version || '' }}"
          if [[ -z "$(echo "${RAW_VERSION}" | xargs)" ]]; then
            RAW_VERSION="sha-$(echo "${GITHUB_SHA}" | cut -c1-7)"
          fi

          IMAGE_TAG="$(echo "${RAW_VERSION}" | xargs)"
          if [[ "${IMAGE_TAG}" != sha-* && "${IMAGE_TAG}" != v* ]]; then
            echo "unsupported version input: ${IMAGE_TAG}. expected sha-* or v*." >&2
            exit 1
          fi

          if [[ "${IMAGE_TAG}" == sha-* ]]; then
            INPUT_SHA="${IMAGE_TAG#sha-}"
            if [[ -z "${INPUT_SHA}" ]]; then
              echo "invalid sha version input: ${IMAGE_TAG}" >&2
              exit 1
            fi
            IS_RELEASE="false"
            OSS_TAG="main-${INPUT_SHA}"
            OSS_PREFIX="ci/main/${INPUT_SHA}"
          else
            IS_RELEASE="true"
            OSS_TAG="${IMAGE_TAG}"
            OSS_PREFIX="release/${IMAGE_TAG}"
          fi

          echo "image_tag=${IMAGE_TAG}" >> "${GITHUB_OUTPUT}"
          echo "is_release=${IS_RELEASE}" >> "${GITHUB_OUTPUT}"
          echo "oss_prefix=${OSS_PREFIX}" >> "${GITHUB_OUTPUT}"
          echo "oss_tag=${OSS_TAG}" >> "${GITHUB_OUTPUT}"

  frontend-runtime-build:
    name: Build Frontend Runtime Image (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    needs: [meta]
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-24.04
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push frontend runtime image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          cache-from: type=gha,scope=frontend-runtime-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=frontend-runtime-${{ matrix.arch }}
          platforms: ${{ matrix.platform }}
          tags: |
            ${{ env.GHCR_FRONTEND_RUNTIME_IMAGE }}:${{ needs.meta.outputs.image_tag }}-${{ matrix.arch }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ needs.meta.outputs.image_tag }}
            org.opencontainers.image.architecture=${{ matrix.arch }}
            runnumber=${{ github.run_id }}

  frontend-runtime-manifest:
    name: Publish Frontend Runtime Manifests
    runs-on: ubuntu-latest
    needs: [meta, frontend-runtime-build]
    permissions:
      packages: write
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create multi-arch manifest
        run: |
          set -euo pipefail
          IMAGE_TAG="${{ needs.meta.outputs.image_tag }}"
          docker buildx imagetools create \
            -t "${GHCR_FRONTEND_RUNTIME_IMAGE}:${IMAGE_TAG}" \
            "${GHCR_FRONTEND_RUNTIME_IMAGE}:${IMAGE_TAG}-amd64" \
            "${GHCR_FRONTEND_RUNTIME_IMAGE}:${IMAGE_TAG}-arm64"

      - name: Update latest tag
        if: ${{ needs.meta.outputs.is_release == 'true' }}
        run: |
          set -euo pipefail
          IMAGE_TAG="${{ needs.meta.outputs.image_tag }}"
          docker buildx imagetools create \
            -t "${GHCR_FRONTEND_RUNTIME_IMAGE}:latest" \
            "${GHCR_FRONTEND_RUNTIME_IMAGE}:${IMAGE_TAG}-amd64" \
            "${GHCR_FRONTEND_RUNTIME_IMAGE}:${IMAGE_TAG}-arm64"

  controller-runtime-build:
    name: Build Controller Runtime Image (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    needs: [meta]
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-24.04
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Build controller binary
        working-directory: backend
        run: |
          set -euo pipefail
          LD_FLAGS="-s -w"
          CGO_ENABLED=0 GOOS=linux GOARCH="${{ matrix.arch }}" go build -ldflags "${LD_FLAGS}" -trimpath -o "bin/controller-objectstorage-${{ matrix.arch }}" main.go

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push controller runtime image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          cache-from: type=gha,scope=controller-runtime-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=controller-runtime-${{ matrix.arch }}
          platforms: ${{ matrix.platform }}
          tags: |
            ${{ env.GHCR_CONTROLLER_RUNTIME_IMAGE }}:${{ needs.meta.outputs.image_tag }}-${{ matrix.arch }}
          build-args: |
            TARGETARCH=${{ matrix.arch }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ needs.meta.outputs.image_tag }}
            org.opencontainers.image.architecture=${{ matrix.arch }}
            runnumber=${{ github.run_id }}

  controller-runtime-manifest:
    name: Publish Controller Runtime Manifests
    runs-on: ubuntu-latest
    needs: [meta, controller-runtime-build]
    permissions:
      packages: write
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create multi-arch manifest
        run: |
          set -euo pipefail
          IMAGE_TAG="${{ needs.meta.outputs.image_tag }}"
          docker buildx imagetools create \
            -t "${GHCR_CONTROLLER_RUNTIME_IMAGE}:${IMAGE_TAG}" \
            "${GHCR_CONTROLLER_RUNTIME_IMAGE}:${IMAGE_TAG}-amd64" \
            "${GHCR_CONTROLLER_RUNTIME_IMAGE}:${IMAGE_TAG}-arm64"

      - name: Update latest tag
        if: ${{ needs.meta.outputs.is_release == 'true' }}
        run: |
          set -euo pipefail
          IMAGE_TAG="${{ needs.meta.outputs.image_tag }}"
          docker buildx imagetools create \
            -t "${GHCR_CONTROLLER_RUNTIME_IMAGE}:latest" \
            "${GHCR_CONTROLLER_RUNTIME_IMAGE}:${IMAGE_TAG}-amd64" \
            "${GHCR_CONTROLLER_RUNTIME_IMAGE}:${IMAGE_TAG}-arm64"

  sealos-build:
    name: Build Sealos Image (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    needs: [meta, frontend-runtime-manifest, controller-runtime-manifest]
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-24.04
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install cache images tools
        run: sudo bash ./.github/scripts/install.sh

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Cache images for sealos
        working-directory: deploy
        run: |
          set -euo pipefail
          IMAGE_TAG="${{ needs.meta.outputs.image_tag }}"
          FRONTEND_IMAGE="${GHCR_FRONTEND_RUNTIME_IMAGE}:${IMAGE_TAG}"
          CONTROLLER_IMAGE="${GHCR_CONTROLLER_RUNTIME_IMAGE}:${IMAGE_TAG}"

          sudo sealos login -u "${{ github.actor }}" -p "${{ secrets.GITHUB_TOKEN }}" ghcr.io
          sed -i -E "/^frontend:/,/^[^[:space:]]/ s#^([[:space:]]*image:[[:space:]]*).*#\\1${FRONTEND_IMAGE}#" charts/objectstorage/values.yaml
          sed -i -E "/^controller:/,/^[^[:space:]]/ s#^([[:space:]]*image:[[:space:]]*).*#\\1${CONTROLLER_IMAGE}#" charts/objectstorage/values.yaml
          sudo sealos registry save --registry-dir=registry_${{ matrix.arch }} --arch ${{ matrix.arch }} .

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push sealos image
        uses: docker/build-push-action@v6
        with:
          context: ./deploy
          file: ./deploy/Kubefile
          push: true
          cache-from: type=gha,scope=sealos-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=sealos-${{ matrix.arch }}
          platforms: ${{ matrix.platform }}
          tags: |
            ${{ env.GHCR_SEALOS_IMAGE }}:${{ needs.meta.outputs.image_tag }}-${{ matrix.arch }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ needs.meta.outputs.image_tag }}
            org.opencontainers.image.architecture=${{ matrix.arch }}
            runnumber=${{ github.run_id }}

      - name: Save sealos image package
        run: |
          set -euo pipefail
          IMAGE_TAG="${{ needs.meta.outputs.image_tag }}"
          docker pull "${GHCR_SEALOS_IMAGE}:${IMAGE_TAG}-${{ matrix.arch }}"
          mkdir -p release-assets
          docker save "${GHCR_SEALOS_IMAGE}:${IMAGE_TAG}-${{ matrix.arch }}" | gzip > "release-assets/objectstorage-cluster-${IMAGE_TAG}-${{ matrix.arch }}.tar.gz"
          ls -lh "release-assets/objectstorage-cluster-${IMAGE_TAG}-${{ matrix.arch }}.tar.gz"

      - name: Upload sealos image package
        uses: actions/upload-artifact@v4
        with:
          name: sealos-image-${{ needs.meta.outputs.image_tag }}-${{ matrix.arch }}
          path: release-assets/objectstorage-cluster-${{ needs.meta.outputs.image_tag }}-${{ matrix.arch }}.tar.gz
          if-no-files-found: error
          retention-days: 14

  sealos-manifest:
    name: Publish Sealos Manifests
    runs-on: ubuntu-latest
    needs: [meta, sealos-build]
    permissions:
      packages: write
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create multi-arch manifest
        run: |
          set -euo pipefail
          IMAGE_TAG="${{ needs.meta.outputs.image_tag }}"
          docker buildx imagetools create \
            -t "${GHCR_SEALOS_IMAGE}:${IMAGE_TAG}" \
            "${GHCR_SEALOS_IMAGE}:${IMAGE_TAG}-amd64" \
            "${GHCR_SEALOS_IMAGE}:${IMAGE_TAG}-arm64"
          docker buildx imagetools inspect "${GHCR_SEALOS_IMAGE}:${IMAGE_TAG}"

      - name: Update latest tag
        if: ${{ needs.meta.outputs.is_release == 'true' }}
        run: |
          set -euo pipefail
          IMAGE_TAG="${{ needs.meta.outputs.image_tag }}"
          docker buildx imagetools create \
            -t "${GHCR_SEALOS_IMAGE}:latest" \
            "${GHCR_SEALOS_IMAGE}:${IMAGE_TAG}-amd64" \
            "${GHCR_SEALOS_IMAGE}:${IMAGE_TAG}-arm64"

  sync-image-aliyun:
    name: Sync Sealos Packages to OSS (${{ matrix.arch }})
    runs-on: ubuntu-latest
    needs: [meta, sealos-manifest]
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    steps:
      - name: Download sealos package
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          pattern: sealos-image-${{ needs.meta.outputs.image_tag }}-${{ matrix.arch }}
          merge-multiple: true

      - name: Install oss tools
        run: |
          set -euo pipefail
          sudo -v
          curl -fsSL https://gosspublic.alicdn.com/ossutil/install.sh | sudo bash

      - name: Sync to OSS
        run: |
          set -euo pipefail
          TAR_NAME="release-assets/objectstorage-cluster-${{ needs.meta.outputs.image_tag }}-${{ matrix.arch }}.tar.gz"
          OSS_PREFIX="${{ needs.meta.outputs.oss_prefix }}"
          OSS_TAR_NAME="objectstorage-cluster-${{ needs.meta.outputs.oss_tag }}-${{ matrix.arch }}.tar.gz"

          md5sum "${TAR_NAME}" > "${TAR_NAME}.md5"
          ossutil64 cp -f -e "${{ secrets.OSS_ENDPOINT }}" \
            -i "${{ secrets.OSS_ACCESS_KEY_ID }}" \
            -k "${{ secrets.OSS_ACCESS_KEY_SECRET }}" \
            "${TAR_NAME}" \
            "oss://${{ vars.OSS_BUCKET }}/${OSS_PREFIX}/${OSS_TAR_NAME}"
          ossutil64 cp -f -e "${{ secrets.OSS_ENDPOINT }}" \
            -i "${{ secrets.OSS_ACCESS_KEY_ID }}" \
            -k "${{ secrets.OSS_ACCESS_KEY_SECRET }}" \
            "${TAR_NAME}.md5" \
            "oss://${{ vars.OSS_BUCKET }}/${OSS_PREFIX}/${OSS_TAR_NAME}.md5"
