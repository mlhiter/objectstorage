apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "objectstorage.fullname" . }}-config
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "objectstorage.labels" . | nindent 4 }}
data:
  OSNamespace: {{ .Release.Namespace | quote }}
  OSAdminNamespace: {{ include "objectstorage.objectStorageNamespace" . | quote }}
  OSAdminSecret: {{ include "objectstorage.objectStorageAdminSecret" . | quote }}
  OSInternalEndpoint: {{ include "objectstorage.objectStorageEndpoint" . | quote }}
  OSExternalEndpoint: {{ include "objectstorage.apiHost" . | quote }}
  OSUDetectionCycleSeconds: {{ .Values.objectstorageConfig.controller.userDetectionCycleSeconds | quote }}
  OSBDetectionCycleSeconds: {{ .Values.objectstorageConfig.controller.bucketDetectionCycleSeconds | quote }}
  OBJECT_STORAGE_INSTANCE: {{ include "objectstorage.objectStorageEndpoint" . | quote }}
  PROMETHEUS_SERVICE_HOST: {{ .Values.objectstorageConfig.monitor.prometheusUrl | quote }}
  config.yaml: |-
    cloud:
      domain: {{ .Values.cloudDomain | quote }}
      {{- if eq (include "objectstorage.scheme" .) "http" }}
      port: {{ default 80 .Values.httpPort }}
      {{- else }}
      port: {{ default 443 .Values.cloudPort }}
      {{- end }}
    objectStorage:
      resources:
        hostingPodCpuMilliCores: {{ .Values.objectstorageConfig.hostingPodCpuMilliCores }}
        hostingPodMemoryMiB: {{ .Values.objectstorageConfig.hostingPodMemoryMiB }}
      components:
        monitoring:
          url: {{ include "objectstorage.monitorUrl" . | quote }}
        billing:
          url: {{ .Values.objectstorageConfig.billingUrl | quote }}
          secret: {{ .Values.objectstorageConfig.billingSecret | quote }}
        appLaunchpad:
          url: {{ .Values.objectstorageConfig.appLaunchpadUrl | quote }}
        objectStorage:
          internalEndpoint: {{ include "objectstorage.objectStorageEndpoint" . | quote }}
          externalEndpoint: {{ include "objectstorage.apiHost" . | quote }}
      realName:
        {{- if .Values.objectstorageConfig.renameEnable }}
        appTokenJwtKey: {{ .Values.objectstorageConfig.appTokenJwtKey | quote }}
        {{- else }}
        appTokenJwtKey: ""
        {{- end }}
      hosting:
        appNamePrefix: {{ .Values.objectstorageConfig.hostingAppNamePrefix | quote }}
        networkProtocol: {{ .Values.objectstorageConfig.hostingNetworkProtocol | quote }}
        networkPort: {{ .Values.objectstorageConfig.hostingNetworkPort }}
