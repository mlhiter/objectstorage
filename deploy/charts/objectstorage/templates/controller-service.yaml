apiVersion: v1
kind: Service
metadata:
  name: {{ include "objectstorage.monitorServiceName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "objectstorage.labels" . | nindent 4 }}
    app.kubernetes.io/component: monitor
spec:
  type: ClusterIP
  ports:
    - name: http
      port: {{ .Values.controller.monitor.port }}
      protocol: TCP
      targetPort: monitor
  selector:
    app: {{ include "objectstorage.fullname" . }}
    app.kubernetes.io/component: controller
    control-plane: controller-manager
    app.kubernetes.io/instance: {{ .Release.Name }}
